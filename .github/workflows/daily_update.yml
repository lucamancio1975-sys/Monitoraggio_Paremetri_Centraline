name: Aggiornamento Giornaliero Dati Meteo CFR Toscana

on:
  schedule:
    # Esecuzione mattutina programmata alle 05:00 ora italiana (Europe/Rome):
    # - Durante Ora Legale estiva (CEST = UTC+2): 03:00 UTC
    # - Durante Ora Solare invernale (CET = UTC+1): 04:00 UTC
    # Il controllo cron-guard integrato nello script assicura l'avvio autorizzato
    # ed evita doppie elaborazioni grazie al controllo di idempotenza dell'archivio.
    - cron: '0 3 * * *'
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      data_target:
        description: 'Data di analisi specifica (formato YYYY-MM-DD). Lasciare vuoto per estrazione automatica di ieri.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  aggiorna-dati:
    name: Estrazione Dati e Aggiornamento Archivio
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configurazione ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esecuzione script di raccolta ed estrazione
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m src.main --cron-guard
          elif [ -n "${{ github.event.inputs.data_target }}" ]; then
            python -m src.main --data "${{ github.event.inputs.data_target }}"
          else
            python -m src.main
          fi

      - name: Commit e Push su GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dati/
          if [ -n "$(git status --porcelain dati/)" ]; then
            git commit -m "Aggiornamento automatico dati meteo [skip ci] - $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          else
            echo "Nessuna variazione rilevata nei dati."
          fi
