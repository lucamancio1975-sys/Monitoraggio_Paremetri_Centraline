name: Aggiornamento Giornaliero Dati Meteo CFR Toscana

on:
  schedule:
    # Esecuzione principale alle 23:50 ora italiana (Europe/Rome)
    # Gestione automatica di ora solare e ora legale
    - cron: '50 23 * * *'
      timezone: 'Europe/Rome'
    # Esecuzione di riserva/recupero notturna alle 01:15 ora italiana (Europe/Rome)
    # per garantire la continuità anche in caso di ritardi di coda su GitHub Actions
    - cron: '15 1 * * *'
      timezone: 'Europe/Rome'
  workflow_dispatch:
    inputs:
      data_target:
        description: 'Data di analisi specifica (formato YYYY-MM-DD). Lasciare vuoto per estrazione automatica.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  aggiorna-dati:
    name: Estrazione Dati e Aggiornamento Archivio
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configurazione ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esecuzione script di raccolta ed estrazione
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m src.main --cron-guard
          elif [ -n "${{ github.event.inputs.data_target }}" ]; then
            python -m src.main --data "${{ github.event.inputs.data_target }}"
          else
            python -m src.main
          fi

      - name: Commit e Push su GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dati/
          if [ -n "$(git status --porcelain dati/)" ]; then
            git commit -m "Aggiornamento automatico dati meteo [skip ci] - $(date +'%Y-%m-%d')"
            git push origin main
          else
            echo "Nessuna variazione rilevata nei dati."
          fi
